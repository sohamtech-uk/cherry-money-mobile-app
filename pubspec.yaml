name: cherry_money_mobile
description: Cherry Money mobile finance workspace and Shipaton demo.
publish_to: none
version: 5.1.0+501
environment:
  sdk: ^3.11.0
dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.0.0
  go_router: ^17.0.0
  dio: ^5.9.2
  flutter_secure_storage: ^10.0.0
  shared_preferences: ^2.5.5
  purchases_flutter: ^9.0.0
  image_picker: ^1.2.1
  file_picker: ^11.0.2
  intl: ^0.20.2
  google_sign_in: ^7.2.0
  google_sign_in_web: ^1.1.3
  url_launcher: ^6.3.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/images/cherrymoney-logo.png
    - assets/images/onboarding/finances.webp
    - assets/images/onboarding/capture.webp
    - assets/images/onboarding/review.webp
  fonts:
    - family: CherrySans
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700

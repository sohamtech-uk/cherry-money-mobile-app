name: Flutter validation
on:
  pull_request:
    paths-ignore: ["docs/**", "README.md"]
  push:
    branches: [main]
    paths-ignore: ["docs/**", "README.md"]
concurrency:
  group: flutter-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format lib test integration_test && git diff --exit-code || (git diff && exit 1)
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: cherry-money-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk

<ion-header class="ion-no-border">
  <ion-toolbar color="primary">
    <ion-title>{{ "Manage Tax" | translate }}</ion-title>
    <ion-buttons slot="start"><ion-back-button></ion-back-button></ion-buttons>
    <ion-buttons slot="end"><ion-button fill="clear" mode="ios" (click)="addNew()"><ion-icon name="add-circle-outline"></ion-icon></ion-button></ion-buttons>
  </ion-toolbar>
  <div *ngIf="data && data.length > 0">
<p  class="swipe">{{ "Swipe left for more options" | translate }}</p>
</div>
</ion-header>

<ion-content *ngIf="data">
  
<p  align="center" *ngIf="data.length == 0">{{ "Sorry! No data found." | translate }}</p>


<ion-item-sliding *ngFor="let tax of data">
<ion-item lines="full" detail>
<ion-label class="ion-text-wrap">{{ tax.tax_name }}<small>{{ tax.tax_value }}%</small></ion-label>
</ion-item>

<ion-item-options>
  <ion-item-option color="success" (click)="addNew(tax)">&nbsp;&nbsp;<ion-icon name="create-outline"></ion-icon>&nbsp;&nbsp;</ion-item-option>
  <ion-item-option color="danger" (click)="remove(tax.id)">&nbsp;&nbsp;<ion-icon name="trash-outline"></ion-icon>&nbsp;&nbsp;</ion-item-option>
</ion-item-options>

</ion-item-sliding>

</ion-content>
